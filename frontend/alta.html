<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alta Hospitalar</title>

    <link rel="stylesheet" href="/style.css/alta.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0b5394;
            margin-bottom: 20px;
        }

        .linha {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .campo {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #0b5394;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        button:hover {
            background: #073763;
        }

        .documento {
            margin-top: 40px;
            border: 2px solid #ddd;
            padding: 30px;
            border-radius: 10px;
            background: #fafafa;
        }

        .documento h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0b5394;
        }

        .info {
            margin-bottom: 15px;
        }

        .assinatura {
            margin-top: 60px;
            text-align: center;
        }

        .assinatura div {
            margin-top: 60px;
            border-top: 1px solid #000;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            padding-top: 10px;
        }

        @media print {

            body {
                background: white;
            }

            button {
                display: none;
            }

            .container {
                box-shadow: none;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Alta Hospitalar</h1>

    <div class="linha">

        <div class="campo">

            <label for="pacienteSelect">
                Selecionar Paciente
            </label>

            <select id="pacienteSelect">
                <option value="">
                    Carregando...
                </option>
            </select>

        </div>

        <div class="campo">

            <label for="dataAlta">
                Data da Alta
            </label>

            <input
                type="date"
                id="dataAlta"
            >

        </div>

    </div>

    <div class="linha">

        <div class="campo">

            <label for="medico">
                Médico Responsável
            </label>

            <input
                type="text"
                id="medico"
                placeholder="Nome do médico"
            >

        </div>

    </div>

    <div class="campo">

        <label for="orientacoes">
            Orientações Médicas
        </label>

        <textarea id="orientacoes">Repouso por 3 dias.
Manter hidratação.
Retornar em caso de piora.
Uso correto das medicações prescritas.</textarea>

    </div>

    <br>

    <div class="botoes">

        <button onclick="gerarAlta()">
            Gerar Alta
        </button>

        <button onclick="imprimirAlta()">
            🖨️ Imprimir
        </button>

    </div>

    <div class="documento" id="documento">

        <h2>
            DOCUMENTO DE ALTA HOSPITALAR
        </h2>

        <div class="info">

            <strong>Paciente:</strong>

            <span id="docNome">
                -
            </span>

        </div>

        <div class="info">

            <strong>Observações:</strong>

            <span id="docSintomas">
                -
            </span>

        </div>

        <div class="info">

            <strong>Medicação:</strong>

            <span id="docMedicacao">
                -
            </span>

        </div>

        <div class="info">

            <strong>Diagnóstico:</strong>

            <span id="docDiagnostico">
                -
            </span>

        </div>

        <div class="info">

            <strong>Data da Alta:</strong>

            <span id="docData">
                -
            </span>

        </div>

        <div class="info">

            <strong>Orientações:</strong>

            <p id="docOrientacoes">
                -
            </p>

        </div>

        <div class="assinatura">

            <div>

                <span id="docMedico">
                    Médico Responsável
                </span>

            </div>

        </div>

    </div>

</div>


<script>

    // =====================================================
    // API
    // =====================================================
    // Como o Express já serve o frontend, usamos a mesma origem.
    // Não usamos mais http://localhost:3000 diretamente.

    const API = "";

    let consultas = [];


    // =====================================================
    // CARREGAR PACIENTES
    // =====================================================

    async function carregarPacientes() {

        const select =
            document.getElementById("pacienteSelect");

        try {

            select.innerHTML =
                `<option value="">Carregando...</option>`;

            const resposta =
                await fetch("/medicacoes");

            if (!resposta.ok) {

                throw new Error(
                    `Erro HTTP: ${resposta.status}`
                );

            }

            const dados =
                await resposta.json();

            if (!Array.isArray(dados)) {

                throw new Error(
                    "A API não retornou uma lista de consultas."
                );

            }

            consultas = dados;

            select.innerHTML =
                `<option value="">Selecione</option>`;


            // =================================================
            // PEGAR NOMES DOS PACIENTES
            // =================================================

            const nomesUnicos = [
                ...new Set(
                    consultas
                        .map(c => c.paciente)
                        .filter(nome => nome)
                )
            ];


            // =================================================
            // ADICIONAR PACIENTES AO SELECT
            // =================================================

            nomesUnicos.forEach(nome => {

                const option =
                    document.createElement("option");

                option.value = nome;

                option.textContent = nome;

                select.appendChild(option);

            });


            // Se não houver pacientes
            if (nomesUnicos.length === 0) {

                select.innerHTML =
                    `<option value="">
                        Nenhum paciente encontrado
                    </option>`;

            }

        }

        catch (erro) {

            console.error(
                "Erro ao carregar pacientes:",
                erro
            );

            select.innerHTML =
                `<option value="">
                    Erro ao carregar pacientes
                </option>`;

            alert(
                "Não foi possível carregar os pacientes.\n\n" +
                "Verifique se o servidor está funcionando."
            );

        }

    }


    // =====================================================
    // GERAR ALTA
    // =====================================================

    function gerarAlta() {

        const nomeSelecionado =
            document.getElementById(
                "pacienteSelect"
            ).value;


        if (!nomeSelecionado) {

            alert(
                "Selecione um paciente."
            );

            return;
        }


        // =================================================
        // BUSCAR CONSULTA DO PACIENTE
        // =================================================

        const consulta =
            consultas.find(
                c =>
                    c.paciente === nomeSelecionado
            );


        if (!consulta) {

            alert(
                "Consulta não encontrada para este paciente."
            );

            return;
        }


        // =================================================
        // PEGAR DADOS DO FORMULÁRIO
        // =================================================

        const dataAlta =
            document.getElementById(
                "dataAlta"
            ).value;

        const medico =
            document.getElementById(
                "medico"
            ).value.trim();

        const orientacoes =
            document.getElementById(
                "orientacoes"
            ).value.trim();


        // =================================================
        // PREENCHER DOCUMENTO
        // =================================================

        document.getElementById(
            "docNome"
        ).innerText =
            consulta.paciente || "-";


        document.getElementById(
            "docSintomas"
        ).innerText =
            consulta.sintomas || "-";


        document.getElementById(
            "docMedicacao"
        ).innerText =
            consulta.medicacao || "-";


        document.getElementById(
            "docDiagnostico"
        ).innerText =
            consulta.diagnostico || "-";


        document.getElementById(
            "docData"
        ).innerText =
            dataAlta || "-";


        document.getElementById(
            "docOrientacoes"
        ).innerText =
            orientacoes || "-";


        document.getElementById(
            "docMedico"
        ).innerText =
            medico || "Médico Responsável";


        alert(
            "Alta gerada com sucesso!"
        );

    }


    // =====================================================
    // IMPRIMIR ALTA
    // =====================================================

    function imprimirAlta() {

        const paciente =
            document.getElementById(
                "docNome"
            ).innerText;


        if (paciente === "-") {

            alert(
                "Gere a alta antes de imprimir."
            );

            return;
        }

        window.print();

    }


    // =====================================================
    // INICIAR
    // =====================================================

    carregarPacientes();

</script>

</body>
</html>
