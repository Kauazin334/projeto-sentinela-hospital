<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="/frontend/style.css/index.css">
</head>

<body>

<div class="container">
    <h2>Hospital Pro</h2>

    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
</div>

<script>

function login(){

    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            usuario: document.getElementById("usuario").value,
            senha: document.getElementById("senha").value

        })

    })

    .then(r => r.json() ) {

        if(!res.ok){
            throw new Error("Login inválido");
        }

        return res.json();

    })

    .then(data => {

        if(data.tipo === "triagem"){
            location.href = "triagem.html";
        }

        else if(data.tipo === "medico"){
            location.href = "medico.html";
        }

        else if(data.tipo === "atendimento"){
            location.href = "atendimento.html";
        }

        else if(data.tipo === "alta"){
            location.href = "alta.html";
        }

        else{
            alert("Tipo de usuário inválido.");
        }

    })

    .catch(err => {

        alert(err.message);

    });

}

</script>

</body>
</html>
