<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Hospital Pro</title>

    <link rel="stylesheet" href="/style.css/index.css">
</head>

<body>

    <div class="container">

        <h2>Hospital Pro</h2>

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Entrar
        </button>

    </div>

    <script>

        function login() {

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;

            if (!usuario || !senha) {
                alert("Digite o usuário e a senha.");
                return;
            }

            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuario: usuario,
                    senha: senha
                })

            })

            .then(res => {

                if (!res.ok) {
                    return res.json()
                        .then(data => {
                            throw new Error(data.erro || "Login inválido");
                        });
                }

                return res.json();

            })

            .then(data => {

                console.log("Login realizado:", data);

                if (data.tipo === "triagem") {

                    window.location.href = "/triagem.html";

                }

                else if (data.tipo === "medico") {

                    window.location.href = "/medico.html";

                }

                else if (data.tipo === "atendimento") {

                    window.location.href = "/atendimento.html";

                }

                else if (data.tipo === "alta") {

                    window.location.href = "/alta.html";

                }

                else {

                    alert("Tipo de usuário inválido.");

                }

            })

            .catch(err => {

                console.error("Erro no login:", err);

                alert(err.message || "Erro ao realizar login.");

            });

        }

        // Permite apertar ENTER para fazer login
        document.getElementById("senha").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                login();
            }

        });

    </script>

</body>
</html>
